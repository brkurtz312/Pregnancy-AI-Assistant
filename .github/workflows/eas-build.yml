name: EAS Build (App Store)

# The counterpart to eas-submit.yml, so a build can be started without a
# laptop. EXPO_TOKEN is already a repository secret used by that workflow and
# by cancel-stale-eas-builds.yml.
#
# Defaults to --no-wait: the build runs on EAS servers either way, and waiting
# only holds a GitHub runner open for the twenty-odd minutes it takes. Watch
# progress at https://expo.dev instead, or tick "wait" to have the Action
# succeed or fail with the build.
#
# Android: production builds an app bundle for Play, production-apk builds an
# APK to sideload onto a test device. This runs --non-interactive, which cannot
# generate signing credentials, so the Android keystore has to exist in EAS
# before the first run here — `eas credentials` once from a laptop. Back it up
# while you are there: an EAS-held keystore that is lost, with Play App Signing
# not enrolled, means the app can never be updated again.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        default: "ios"
        type: choice
        options:
          - ios
          - android
      profile:
        description: "EAS build profile"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - production-apk
          - preview
      wait:
        description: "Hold the runner open until the build finishes"
        required: false
        default: false
        type: boolean

jobs:
  check-whats-new:
    name: Verify What's New entry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # No version here on purpose: action-setup reads the pinned version
        # from package.json's packageManager field, so CI and laptops cannot
        # drift apart.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check What's New entry
        run: pnpm --filter @workspace/scripts run check-whats-new

  build:
    name: EAS Build
    runs-on: ubuntu-latest
    needs: check-whats-new
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Report the version being built
        working-directory: artifacts/pregnancy-calculator-mobile
        # A build of the wrong commit has cost a round trip more than once.
        run: node -e "const v=require('./app.json').expo;console.log('version',v.version,'runtimeVersion',v.runtimeVersion)"

      - name: EAS Build (queue and return)
        if: ${{ !inputs.wait }}
        working-directory: artifacts/pregnancy-calculator-mobile
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait

      - name: EAS Build (wait for completion)
        if: ${{ inputs.wait }}
        working-directory: artifacts/pregnancy-calculator-mobile
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive
