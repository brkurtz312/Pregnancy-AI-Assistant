name: CI

# Lint, format, typecheck and test on every pull request and every push to
# main. Nothing here needs a database, an API key or a network call: the
# api-server suites that require Postgres skip themselves when DATABASE_URL is
# absent, which is the whole reason this can run as a gate.
#
# Deliberately does NOT build. The web app's vite.config.ts throws unless PORT
# and BASE_PATH are set when the config loads, so `vite build` cannot run
# anywhere that does not set them — which is also why the Cloudflare Pages
# checks fail on every pull request. Worth fixing with the rest of the Replit
# cleanup (docs/replit-exit-plan.md, Phase 3); until then a build step here
# would be red for a reason unrelated to the change under test.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: this workflow inspects code, it never writes to the repository.
permissions:
  contents: read

# One run per branch. A new push cancels the run still in flight rather than
# queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each check below runs even when an earlier one fails, so one run
      # reports everything that is wrong instead of only the first thing. The
      # job still fails if any of them do.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm run lint

      - name: Format
        if: ${{ !cancelled() }}
        run: pnpm run format

      - name: Typecheck libraries
        if: ${{ !cancelled() }}
        run: pnpm run typecheck:libs

      # Path-scoped filters rather than plain `-r`: `pnpm -r` also selects the
      # workspace root, whose own scripts recurse over every package, so the
      # suites would run twice.
      - name: Typecheck apps and scripts
        if: ${{ !cancelled() }}
        run: >-
          pnpm -r
          --filter "./artifacts/**"
          --filter "./scripts"
          --if-present run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: >-
          pnpm -r
          --filter "./artifacts/**"
          --filter "./lib/**"
          --filter "./scripts"
          --if-present run test

# ── What is not covered ──────────────────────────────────────────────────────
# The mobile app's Watch sources are only compared against ios/ when that
# directory exists, since `expo prebuild` generates it and it is gitignored.
# Run `pnpm --filter @workspace/pregnancy-calculator-mobile run typecheck`
# after a prebuild to exercise that check, and the Xcode project assertions in
# plugins/__tests__ with it.
