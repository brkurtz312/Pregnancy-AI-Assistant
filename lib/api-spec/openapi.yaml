    AlertConfig:
      type: object
      description: Current alert channel configuration. Sensitive values are masked.
      properties:
        alertSlackWebhookUrl:
          type: ["string", "null"]
          description: Masked Slack webhook URL, or null if not set in DB.
        alertResendApiKey:
          type: ["string", "null"]
          description: Masked Resend API key, or null if not set in DB.
        alertEmail:
          type: ["string", "null"]
          description: Recipient email address for alerts, or null if not set.
        alertFromEmail:
          type: ["string", "null"]
          description: Sender email address for alerts, or null if not set.
      required:
        - alertSlackWebhookUrl
        - alertResendApiKey
        - alertEmail
        - alertFromEmail
    UpdateAlertConfigBody:
      type: object
      description: >
        Fields to update. Omit a field to leave it unchanged.
        Set a field to null to clear the DB row (falls back to env var).
      properties:
        alertSlackWebhookUrl:
          type: ["string", "null"]
          maxLength: 2048
        alertResendApiKey:
          type: ["string", "null"]
          maxLength: 500
        alertEmail:
          type: ["string", "null"]
          format: email
          maxLength: 320
        alertFromEmail:
          type: ["string", "null"]
          format: email
          maxLength: 320
    UpdateAlertConfigResponse:
      type: object
      properties:
        updated:
          type: array
          items:
            type: string
          description: List of app_config keys that were written or cleared.
      required:
        - updated
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer
      description: Clerk session token (JWT) from the authenticated user.
    adminToken:
      type: http
      scheme: bearer
      description: >
        Server-side admin token matched against the ADMIN_CHECK_TOKEN env var.
        This is a dedicated secret distinct from the reviewer access code.
